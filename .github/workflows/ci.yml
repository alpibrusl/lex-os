name: ci

# lex-os had no CI; this gates the workspace so the contract tests
# (crates/lex-os/tests/cli_contract.rs) actually enforce that the README
# and the CLI reference stay in sync with the binary. Default features
# only — the `firecracker` perimeter needs a KVM host and is exercised
# out-of-band via demo/.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # Without this, `main` drifts out of rustfmt silently and every
      # later change carries formatting noise it did not make. It had
      # already happened once: six files were unformatted on `main` and
      # only came back by accident, in an unrelated commit that happened
      # to touch them. The sibling gates (lex-k8s, lex-iac) all run it.
      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      # The KVM gate's own regression test, run on ordinary CI because it
      # needs no KVM — only saved output from runs that did.
      #
      # `wall2.sh` used to exit 0 whenever the box booted, so the nightly
      # job stayed green through the entire life of #79 while the guest
      # printed "UNEXPECTED" to a console nobody parsed. The decision now
      # lives in demo/assert-wall.sh, which means it can be held to real
      # logs here: one from a passing run, one captured from the broken
      # wall itself, and one from a wall that refuses everything.
      - name: The wall assertions catch what they exist to catch
        run: |
          set -e
          bash demo/assert-wall.sh demo/fixtures/wall2-good.log
          for bad in broken-79 all-drop; do
            if bash demo/assert-wall.sh "demo/fixtures/wall2-$bad.log" 2>/dev/null; then
              echo "assert-wall accepted demo/fixtures/wall2-$bad.log; it must not" >&2
              exit 1
            fi
            echo "correctly refused: $bad"
          done
