name: firecracker (KVM)

# The real perimeter — the part that makes "sealed at the edge" true rather
# than simulated — can only be exercised on a host with /dev/kvm and root.
# This job therefore runs ONLY on a self-hosted runner labelled `kvm`, and
# only when invoked manually (or on the nightly cron). It never runs on the
# default GitHub-hosted infra, so it can't redden a normal PR; it is the gate
# that must go green before the Firecracker backend can become the default
# (lex-os#23).
# It also runs on any *push* that touches the perimeter or the demos that
# exercise it, so a change to the sandbox boundary gets a real boot behind
# it without anyone remembering to dispatch this (#54).
#
# `push`, deliberately, and NOT `pull_request`. This repository is public
# and this runner has passwordless sudo; a `pull_request` trigger lets
# anyone who forks the repo execute code on it. Only people who can push to
# this repository can start this job, which is the property that makes it
# safe to have at all. #54 asks for a required PR check — that wording
# predates the runner existing, and following it literally would trade a
# gate for a remote shell. See docs/self-hosted-kvm-runner.md.
on:
  workflow_dispatch:
  push:
    paths:
      - "crates/lex-os-perimeter/**"
      - "crates/lex-os-proto/**"
      - "crates/lex-os-guest/**"
      - "demo/**"
      - ".github/workflows/firecracker.yml"
  schedule:
    - cron: "23 4 * * *"

jobs:
  wall:
    # Requires a self-hosted runner with KVM + root + the firecracker assets.
    runs-on: [self-hosted, kvm]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with the real perimeter (firecracker is the DEFAULT feature)
        run: cargo build -p lex-os
      - name: Fetch microVM assets (firecracker + kernel + rootfs)
        run: sudo bash demo/setup-assets.sh
      - name: Wall 2 — kernel egress wall drops a non-allowlisted host
        # Boots a real Firecracker microVM and asserts traffic to 8.8.8.8 is
        # dropped at the host tap while the one allowlisted host is reachable.
        run: sudo bash demo/wall2.sh

      - name: vsock re-attach across a reprovision (#27 task 2)
        # The other thing only a KVM host can prove, and until now the only
        # one nothing ran. `demo/reprovision.sh` boots a real microVM, has
        # the in-guest agent dispose its own box mid-task, and asserts the
        # supervisor rebuilt it, re-`accept()`ed the fresh guest over vsock,
        # and that real work ran *after* the rebuild — not merely that the
        # session ended without erroring.
        #
        # Without `Transport::reconnect` this fails rather than hangs: the
        # supervisor keeps the dead guest's stream and the agent gives up.
        # That is worth gating, because the failure is silent in exactly the
        # case the box is for — an unattended run whose sandbox died.
        run: sudo bash demo/reprovision.sh
